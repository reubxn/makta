<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Matka title card</title>
<link rel="stylesheet" href="card.css" />
<style>
  .wrap { position: absolute; left: 220px; right: 220px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .mark { display: flex; align-items: center; gap: 26px; font-family: var(--serif); font-weight: 600; font-size: 132px; line-height: 1; letter-spacing: 0.01em; }
  .mark i { display: block; width: 30px; height: 30px; background: var(--accent); }
  .hero { font-family: var(--serif); font-weight: 300; font-style: italic; font-size: 60px; line-height: 1.2; padding-left: 4px; }
  .rule { width: 120px; height: 3px; background: var(--ink); margin: 6px 0 0 4px; }
  .sub { font-size: 30px; line-height: 1.45; color: var(--ink-2); max-width: 1180px; padding-left: 4px; }
  .foot { position: absolute; left: 224px; bottom: 70px; font-size: 22px; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark r" style="--d: 0s"><i></i>Matka</div>
    <div class="hero r" style="--d: 0.25s">Same cancer, same treatment. Different distance.</div>
    <div class="rule r" style="--d: 0.45s"></div>
    <div class="sub r" style="--d: 0.55s">How far Finnish patients travel for radiotherapy, and how much of that two evidence-based shorter schedules would remove.</div>
  </div>
  <div class="foot r" style="--d: 0.7s">Junction 2026 · AstraZeneca challenge · 2-minute demo</div>
</body>
</html>
